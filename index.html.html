<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Viewer</title>

    <style>
  li button {
    margin-left: 8px;
  }
</style>
</head>
<body>
    <h1>Posts Search</h1>
    <p>Search by User ID</p>
    <input type="text" name="userIdInput" id="userIdInput">
    <button type="button" name="idButton" id="idButton">Show Posts</button>
    <p id="postTitles"></p>
    <ul id="postTitleList">
       
    </ul>



<script>
const userIdInput = document.getElementById("userIdInput")
const idButton = document.getElementById("idButton")
const postTitles = document.getElementById("postTitles")
const postTitleList = document.getElementById("postTitleList")

const idSearch = async () => {
   const id = userIdInput.value.trim()
   if(id.length === 0) {
    postTitles.textContent = "Please enter a user id."
   } else {
    postTitleList.textContent = ""
    postTitles.textContent = "Loading..."
    try {
       const url = `https://jsonplaceholder.typicode.com/posts?userId=${id}`
       const response = await fetch(url)
       if(response.status === 404) {
         postTitles.textContent = "Post Titles not found."
       } else if (!response.ok) {
        postTitles.textContent = "Error loading post titles."
       } else {
        postTitles.textContent = "Post Titles"
        const posts = await response.json()
        if(posts.length === 0) {
            postTitles.textContent = `No posts for user: ${id}`
        } else {
            posts.forEach(post => {
            const li = document.createElement("li")
            const showPost = document.createElement("button")
            const postBody = document.createElement("p")
            li.textContent = post.title
            showPost.textContent = "Show Post"
            showPost.addEventListener("click", () => {
                const body = post.body
                postBody.textContent = body
            })
            li.append(showPost, postBody)
            postTitleList.append(li)
            });
        }
       }
    } catch (error) {
        postTitles.textContent = "A network error has occured."
        console.log(error)       
    }
   }
}

idButton.addEventListener("click", idSearch)
userIdInput.addEventListener("keydown", (event) => {
    if(event.key === "Enter") {
        idSearch()
    }
})
</script>
</body>
</html>
